professional_journey: |
  My path into technology wasn't planned as a straight line toward
  leadership — it started, quite literally, at the code level.

  I began my career in 2000 as a developer and database architect,
  writing Java and Oracle PL/SQL for Apple's internal Directory Services
  platform — the system that tracked employees, contractors, vendors,
  and hardware across the company, tied into HR systems and LDAP under a
  24x7 support model. It was unglamorous, deadline-driven work, and it
  taught me two things that have stayed with me ever since: production
  systems don't forgive sloppy thinking, and the people who keep them
  running rarely get the credit they deserve.

  Over the next decade at Infosys, I moved steadily from writing code to
  designing systems to leading the teams that built them — solution
  architecture and delivery for clients like Molex, Solectron, Boeing,
  Cisco, and Microsoft, much of it in the unglamorous but essential world
  of B2B and EDI integration: gateways, mapping migrations, supplier
  onboarding — the plumbing that lets large companies actually talk to
  each other. A short stint at Software AG building out a North American
  delivery practice sharpened a different muscle: not just delivering
  programs, but building the organization that delivers them.

  The next chapter, at IBM, is where the scope really opened up. I ran
  multi-year, multi-country programs for Lowe's, Tesco, Forever 21,
  T-Mobile, and Abbott — order management modernization, supply chain
  integration, platform launches across dozens of workstreams and
  international teams. Then came Caterpillar: a five-year engagement
  where I owned the technical and commercial evolution of their B2B/B2C
  digital commerce platform, including a first-of-its-kind mobile
  payment integration (WeChat Pay, Alipay, UnionPay) for their dealer
  network, and the security architecture behind it — cryptographic
  request signing, merchant key custody, the unglamorous but critical
  work of making sure a payment system can't be spoofed. That platform
  grew from roughly half a million dollars to over $120M in annual
  revenue under my watch, across seven countries and 70+ integrated
  systems.

  Since 2020, I've been Vice President and Chief of Staff to the Chief
  Delivery Officer at GlobalLogic, where the job has shifted again — from
  running individual programs to shaping how a 20,000+ person global
  engineering organization operates. Today that means leading enterprise
  AI strategy: defining how GenAI and agentic AI get evaluated, adopted,
  and governed across a company this size, running technical and
  commercial evaluations of frontier model providers, and personally
  building the prototypes and automation that inform those decisions. It
  also means owning a $300M+ portfolio of strategic client programs and
  the operating rhythm — planning, forecasting, executive reviews — that
  keeps a global organization moving in the same direction.

  Looking back, the throughline isn't really "developer to executive."
  It's that I've never stopped wanting to understand how things actually
  work underneath — which is, not coincidentally, exactly why I'm
  building this website myself instead of hiring someone to do it.
