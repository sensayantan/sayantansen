# Runs automatically whenever a commit touches a feature folder
# (AboutMe/, BLOG/, DAYBREAK/), content/ or admin/.
#
# AboutMe/content/, BLOG/content/ and content/ are what the admin at /admin
# writes (Decap CMS commits Markdown/YAML straight to `main`); this workflow
# turns that into static pages and data via BLOG/render_blogs.py,
# AboutMe/render_about.py and backend/render_project_docs.py,
# so publishing needs no manual step beyond clicking Publish.
#
# DAYBREAK/*.html is written by the external news generator, which knows
# nothing about this site's conventions — it omits the "My Experiment" nav
# link and crams the category links into the masthead. Every hand-fix to an
# edition used to be lost the next morning when a fresh one landed;
# DAYBREAK/patch_daybreak.py re-applies them here instead, which is what
# makes them survive. That script also writes DAYBREAK/data/daybreak-index.json,
# the list of editions DAYBREAK/archive.html's calendar reads, which is why that
# file is in the commit list below — without it the index is rebuilt every
# run and never shipped. The [skip ci] on the commit below matters more than
# usual now: without it, committing a patched edition back to DAYBREAK/**
# would re-trigger this same workflow.
name: Render site content

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "AboutMe/**"
      - "BLOG/**"
      - "DAYBREAK/**"
      # Decap validates config.yml in the browser, and a value it rejects
      # replaces the whole admin with an error rather than degrading. So a
      # bad config is invisible until someone opens /admin. Checking it here
      # means a push that breaks it fails CI instead.
      - "admin/**"
  # Run on demand from the Actions tab. The push trigger above only fires on
  # the content and feature folders, so a change to this workflow or to one of the
  # render scripts cannot exercise itself — it otherwise waits for the next
  # edition or Publish before anyone finds out it is broken.
  workflow_dispatch:

# Needed so the final step below can push a commit back to this repo.
permissions:
  contents: write

jobs:
  render:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 from
    # 2026-10-19. 24.04 is what every run so far has used; moving to a new
    # image should be a deliberate, tested change, not a silent one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate the CMS config
        run: python backend/check_cms_config.py

      - name: Render blog posts
        run: python BLOG/render_blogs.py

      - name: Render About Me page
        run: python AboutMe/render_about.py

      - name: Render project documentation
        run: python backend/render_project_docs.py

      - name: Re-apply site conventions to Daybreak editions
        run: python DAYBREAK/patch_daybreak.py

      - name: Commit rendered output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add BLOG/posts/ BLOG/data/blogs.json AboutMe/data/about.json data/project-docs.json DAYBREAK/
          git diff --cached --quiet || git commit -m "Render site content [skip ci]"
          git push
