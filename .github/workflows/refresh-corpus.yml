# Re-fetches the autism corpus, rebuilds the embedding index, and commits
# the regenerated page data — the same fetch/build/commit shape as
# render-content.yml, but on a schedule rather than a content push, because
# nothing in this repo changes when PubMed publishes a new paper.
#
# Only data/autism-faq.json is committed. corpus/*.jsonl and index.pkl are
# gitignored: both are derived, and the index is a ~3 MB pickle that would
# churn the repo every month for no benefit.
name: Refresh autism corpus

on:
  schedule:
    # 06:00 UTC on the 1st of each month. Monthly rather than daily because
    # the install alone is minutes, and the literature does not move faster.
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

# A run takes several minutes; never let two overlap on the same branch.
concurrency:
  group: refresh-corpus
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: experiments/autism-rag/requirements.txt

      # sentence-transformers pulls in torch, and the default Linux wheel is
      # the CUDA build — roughly 2.5 GB to download for a runner with no GPU.
      # Installing the CPU wheel first means the next step finds torch
      # already satisfied.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r experiments/autism-rag/requirements.txt

      # ~130 MB, and it never changes for a pinned model name. The key has
      # the model in it so switching models misses the cache rather than
      # silently reusing the wrong weights.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5

      # NCBI asks callers to identify themselves. A tool name is enough;
      # deliberately no email, so nothing personal ends up in the repo.
      - name: Fetch PubMed abstracts
        working-directory: experiments/autism-rag
        env:
          NCBI_TOOL: sayantansen-autism-rag
        run: python fetch_pubmed.py

      - name: Fetch clinical trials
        working-directory: experiments/autism-rag
        run: python fetch_trials.py

      - name: Build the embedding index
        working-directory: experiments/autism-rag
        run: python build_index.py

      # Not a gate, just a record. The thresholds were set from one month's
      # corpus; if the separation between on-topic and off-topic scores ever
      # collapses, this log is where it will show up first.
      - name: Report score separation
        working-directory: experiments/autism-rag
        run: python calibrate.py

      - name: Regenerate page data
        working-directory: experiments/autism-rag
        run: python build_page_data.py

      - name: Commit regenerated page data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/autism-faq.json
          git diff --cached --quiet || git commit -m "Refresh autism corpus [skip ci]"
          git push
