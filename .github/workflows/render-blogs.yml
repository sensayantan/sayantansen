# Runs automatically whenever a commit touches content/blogs/ — which is
# exactly what happens when a post is saved via the admin at /admin (Decap
# CMS commits the Markdown file straight to `main`). This workflow turns
# that Markdown into a real static page (backend/render_blogs.py) and
# commits the result back, so publishing a post needs no manual step
# beyond clicking Publish in the admin.
name: Render blog posts

on:
  push:
    branches: [main]
    paths:
      - "content/blogs/**"

# Needed so the final step below can push a commit back to this repo.
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Render posts
        run: python backend/render_blogs.py

      - name: Commit rendered output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blogs/ data/blogs.json
          git diff --cached --quiet || git commit -m "Render blog posts [skip ci]"
          git push
