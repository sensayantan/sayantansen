backend:
  name: github
  repo: sensayantan/sayantansen
  branch: main
  # The Cloudflare Pages project deployed from oauth-proxy/ (see that
  # folder's README for setup). Replace with your actual *.pages.dev URL
  # once the project is created.
  base_url: https://sayantansen-oauth.sen-sayantan.workers.dev
  auth_endpoint: api/auth

# Publishing straight to `main` (no editorial review step) — matches how
# every other part of this site publishes. Switch to "editorial_workflow"
# later if drafts/review ever become useful.
publish_mode: simple

# Each feature folder keeps its own media; this global default is only a
# fallback for a collection that names none.
media_folder: "/BLOG/images"
public_folder: "/BLOG/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "BLOG/content"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    # One folder per post. Decap does not uniquify uploads: a second file
    # with the same name lands on the same path and replaces the first,
    # silently changing the picture in whatever post already pointed there.
    # Camera and browser defaults collide constantly — "images.jpeg" and
    # "IMG_1234.jpg" are the usual culprits. Per-post folders keep those
    # apart. Two files of the same name in the SAME post still collide, so
    # rename before uploading when it matters.
    #
    # The site is served from the root of sensayantan.com, so public_folder
    # is root-absolute; BLOG/render_blogs.py makes it relative for each page.
    media_folder: "/BLOG/images/{{slug}}"
    public_folder: "/BLOG/images/{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Date"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        hint: "The day the post is about. No clock — a blog post does not need one."
      - label: "End date"
        name: "end_date"
        widget: "datetime"
        required: false
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        hint: "Optional. For a trip or anything spanning days, the last day. The blog list then shows a range, e.g. April 3-7, 2026. Leave empty for a single date."
      - label: "Banner Image"
        name: "banner"
        widget: "image"
        required: false
        hint: "One image for the post. It appears across the top of the article and as its thumbnail in the blog list. Separate from the Images below, which go inside the article."
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        # No `field`/`fields` key: that is what makes Decap render a single
        # comma-separated box rather than an add-one-at-a-time list.
        hint: "Type several separated by commas, e.g. travel, peru, machu picchu — no # needed."
      - label: "Layout"
        name: "layout"
        widget: "select"
        default: "standard"
        options:
          - { label: "Standard (text only)", value: "standard" }
          - { label: "Hero image", value: "hero" }
          - { label: "Image gallery", value: "gallery" }
        hint: "Hero: one big image up top. Gallery: a grid of all uploaded images."
      - label: "Images"
        name: "images"
        widget: "list"
        required: false
        fields:
          - { label: "Image", name: "image", widget: "image" }
          - { label: "Caption", name: "caption", widget: "string", required: false }
      - label: "Video URL"
        name: "video"
        widget: "string"
        required: false
        hint: "A YouTube or Vimeo link, e.g. https://youtu.be/xxxxxxxxxxx. It is embedded as a player at the end of the post. Do not put video links in PDF Attachment below - that field is for uploaded files."

      - label: "PDF Attachment"
        name: "attachment"
        widget: "file"
        required: false
        media_folder: "/BLOG/files"
        public_folder: "/BLOG/files"
      - label: "Body"
        name: "body"
        widget: "markdown"
        # `buttons` only accepts inline/block formatting names — "image" is
        # NOT one of them, and putting it here fails config validation and
        # takes the whole admin down. Image insertion is an editor
        # component, configured separately below.
        buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"]
        editor_components: ["image", "code-block"]
        hint: "Use the image button to place a picture inline, where the cursor is. The Images field below is for a gallery at the end of the post."

  # Sayantan Sen website Project Documentation. Nested lists (epic -> stories -> criteria) are
  # workable in the CMS but clumsy; the file is also meant to be edited
  # directly, by Codex when it appends the Daybreak epics. Both routes write
  # the same YAML.
  - name: "projectdocs"
    label: "Project Documentation"
    files:
      - name: "projectdocs"
        label: "Sayantan Sen website Project Documentation"
        file: "ProjectDocs/content/project-docs.yml"
        fields:
          - label: "Document"
            name: "document"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Document purpose", name: "purpose", widget: "text" }
              - { label: "Product vision", name: "vision", widget: "text" }
              - label: "Core principles"
                name: "principles"
                widget: "list"
                required: false
                field: { label: "Principle", name: "principle", widget: "text" }
          - label: "Epics"
            name: "epics"
            widget: "list"
            label_singular: "Epic"
            summary: "Epic {{fields.number}} — {{fields.title}} ({{fields.project}})"
            fields:
              - { label: "Project", name: "project", widget: "string", default: "Sayantan Sen website Project Documentation", hint: "Keep this exactly as is: a different value splits the page into a second project." }
              - { label: "Epic number", name: "number", widget: "number", value_type: "int" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Summary", name: "summary", widget: "text", required: false }
              - label: "Status"
                name: "status"
                widget: "select"
                default: "In progress"
                options: ["Done", "In progress", "Blocked"]
              - label: "Stories"
                name: "stories"
                widget: "list"
                label_singular: "Story"
                summary: "{{fields.number}} — {{fields.title}}"
                fields:
                  - { label: "Story number", name: "number", widget: "string", hint: "e.g. 1.1" }
                  - { label: "Title", name: "title", widget: "string" }
                  - label: "Status"
                    name: "status"
                    widget: "select"
                    default: "In progress"
                    options: ["Done", "In progress", "Blocked"]
                    hint: "Not built yet? Use the Backlog list below instead of a story here."
                  - { label: "Narrative", name: "narrative", widget: "text", required: false, hint: "As a ..., I want ..., so that ..." }
                  - label: "Acceptance criteria"
                    name: "acceptance_criteria"
                    widget: "list"
                    required: false
                    field: { label: "Criterion", name: "criterion", widget: "text" }
                  - label: "Assumptions"
                    name: "assumptions"
                    widget: "list"
                    required: false
                    field: { label: "Assumption", name: "assumption", widget: "text" }
                  - { label: "Notes", name: "notes", widget: "text", required: false }
          - label: "Backlog"
            name: "backlog"
            widget: "list"
            required: false
            label_singular: "Backlog item"
            summary: "{{fields.date}} — {{fields.title}}"
            hint: "Identified work that has not been built. Shows on the page as a table, separate from the epics above."
            fields:
              - label: "Epic"
                name: "epic"
                widget: "string"
                hint: "Must match an epic's Title exactly, so the table can group by it."
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text", required: false }
              - label: "Type"
                name: "type"
                widget: "select"
                default: "Feature Development"
                options: ["Technical Debt", "Feature Enhancement", "Feature Development"]
              - label: "Date of backlog"
                name: "date"
                widget: "datetime"
                date_format: "YYYY-MM-DD"
                time_format: false
                format: "YYYY-MM-DD"
                hint: "The day this item was identified, not a due date."

          - label: "Definition of done"
            name: "definition_of_done"
            widget: "list"
            required: false
            field: { label: "Item", name: "item", widget: "text" }
          - label: "Out of scope"
            name: "out_of_scope"
            widget: "list"
            required: false
            field: { label: "Item", name: "item", widget: "text" }

  - name: "about"
    label: "About Me Page"
    # AboutMe/images holds its two photos. Named here so the picker shows
    # them rather than the blog images the global default points at.
    media_folder: "/AboutMe/images"
    public_folder: "/AboutMe/images"
    files:
      - name: "about"
        label: "About Me"
        file: "AboutMe/content/about.yml"
        fields:
          - label: "About Me — intro text"
            name: "about_intro"
            widget: "markdown"
            buttons: ["bold", "italic", "link"]
          - label: "Profile Photos"
            name: "profile_photos"
            widget: "list"
            required: false
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Caption", name: "caption", widget: "string", required: false }
              - label: "This photo is AI-generated"
                name: "ai_generated"
                widget: "boolean"
                default: false
          - label: "My Professional Journey"
            name: "professional_journey"
            widget: "markdown"
            buttons: ["bold", "italic", "link", "heading-three", "bulleted-list"]
          - label: "My Personal Journey"
            name: "personal_journey"
            widget: "markdown"
            required: false
            buttons: ["bold", "italic", "link"]
            hint: "Shown as its own \"My Personal Journey\" section, between About Me and My Family / My World."
          - label: "My Family / My World — intro text"
            name: "family_intro"
            widget: "markdown"
            required: false
            buttons: ["bold", "italic", "link"]
          - label: "Family Photos"
            name: "family_photos"
            widget: "list"
            required: false
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Caption", name: "caption", widget: "string", required: false }
