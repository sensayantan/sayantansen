backend:
  name: github
  repo: sensayantan/sayantansen
  branch: main
  # The Cloudflare Pages project deployed from oauth-proxy/ (see that
  # folder's README for setup). Replace with your actual *.pages.dev URL
  # once the project is created.
  base_url: https://sayantansen-oauth.sen-sayantan.workers.dev
  auth_endpoint: api/auth

# Publishing straight to `main` (no editorial review step) — matches how
# every other part of this site publishes. Switch to "editorial_workflow"
# later if drafts/review ever become useful.
publish_mode: simple

media_folder: "assets/images/blog"
public_folder: "assets/images/blog"

collections:
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "content/blogs"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        hint: "Your hashtags, e.g. cricket, travel — no # needed here."
      - label: "Layout"
        name: "layout"
        widget: "select"
        default: "standard"
        options:
          - { label: "Standard (text only)", value: "standard" }
          - { label: "Hero image", value: "hero" }
          - { label: "Image gallery", value: "gallery" }
        hint: "Hero: one big image up top. Gallery: a grid of all uploaded images."
      - label: "Images"
        name: "images"
        widget: "list"
        required: false
        fields:
          - { label: "Image", name: "image", widget: "image" }
          - { label: "Caption", name: "caption", widget: "string", required: false }
      - label: "PDF Attachment"
        name: "attachment"
        widget: "file"
        required: false
        media_folder: "assets/files/blog"
        public_folder: "assets/files/blog"
      - label: "Body"
        name: "body"
        widget: "markdown"
        buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"]

  - name: "about"
    label: "About Me Page"
    files:
      - name: "about"
        label: "About Me"
        file: "content/about.yml"
        fields:
          - label: "About Me — intro text"
            name: "about_intro"
            widget: "markdown"
            buttons: ["bold", "italic", "link"]
          - label: "Profile Photos"
            name: "profile_photos"
            widget: "list"
            required: false
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Caption", name: "caption", widget: "string", required: false }
              - label: "This photo is AI-generated"
                name: "ai_generated"
                widget: "boolean"
                default: false
          - label: "My Professional Journey"
            name: "professional_journey"
            widget: "markdown"
            buttons: ["bold", "italic", "link", "heading-three", "bulleted-list"]
          - label: "My Personal Journey"
            name: "personal_journey"
            widget: "markdown"
            required: false
            buttons: ["bold", "italic", "link"]
            hint: "Shown at the top of the My Family / My World section."
          - label: "My Family / My World — intro text"
            name: "family_intro"
            widget: "markdown"
            required: false
            buttons: ["bold", "italic", "link"]
          - label: "Family Photos"
            name: "family_photos"
            widget: "list"
            required: false
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Caption", name: "caption", widget: "string", required: false }
